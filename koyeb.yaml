# koyeb.yaml - jeeseek.top 部署配置
# 用法：花总 GitHub 登录 Koyeb 后，连接 jeeseek-fly 仓库即可自动识别

app:
  name: jeeseek
  run_command: "python server.py"
  docker:
    dockerfile: Dockerfile
    # 也可以直接走 GitHub 自动 build
  envs: []
  health_checks:
    - type: HTTP
      port: 8001
      path: /api/stats
      interval: 30
      timeout: 5
  regions:
    - was  # 优先美西（花总从亚洲访问延迟可接受）
  instance_type: free  # nano 0.1 vCPU / 512MB
  ports:
    - port: 8001
      protocol: HTTP

# GitHub Actions 自动部署（可选）
# 花总 push 到 main → Koyeb 自动 rebuild