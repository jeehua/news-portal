<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 知几察微</title>
<meta name="description" content="知几察微 jeeseek.top 邀请制登录入口">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  background: linear-gradient(135deg, #f0f4f8 0%, #e0e7ef 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #1f2937;
}
.card {
  background: #ffffff;
  border-radius: 16px;
  box-shadow: 0 10px 40px rgba(15, 23, 42, 0.08), 0 1px 3px rgba(15, 23, 42, 0.04);
  padding: 40px;
  width: 100%;
  max-width: 420px;
}
.brand { text-align: center; margin-bottom: 28px; }
.brand .logo { font-size: 36px; font-weight: 800; color: #2563eb; letter-spacing: 1px; }
.brand .sub { color: #64748b; font-size: 14px; margin-top: 6px; }
.brand .badge {
  display: inline-block;
  margin-top: 10px;
  padding: 3px 10px;
  border-radius: 999px;
  background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 13px;
  color: #475569;
  margin-bottom: 6px;
  font-weight: 500;
}
.form-group input {
  width: 100%;
  padding: 12px 14px;
  border: 1.5px solid #e2e8f0;
  border-radius: 8px;
  font-size: 15px;
  font-family: inherit;
  background: #f8fafc;
  transition: all 0.2s;
  outline: none;
}
.form-group input:focus {
  border-color: #2563eb;
  background: #ffffff;
  box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
}
.btn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  font-family: inherit;
  transition: all 0.2s;
}
.btn-primary {
  background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
  color: #ffffff;
  margin-top: 8px;
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
  transform: translateY(-1px);
}
.btn-primary:disabled {
  opacity: 0.6;
  cursor: wait;
}
.toggle {
  text-align: center;
  margin-top: 18px;
  font-size: 13px;
  color: #64748b;
}
.toggle a {
  color: #2563eb;
  text-decoration: none;
  font-weight: 600;
  margin-left: 4px;
}
.toggle a:hover { text-decoration: underline; }
.error {
  background: #fef2f2;
  color: #b91c1c;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  border-left: 3px solid #dc2626;
  display: none;
}
.error.show { display: block; }
.success {
  background: #f0fdf4;
  color: #15803d;
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 13px;
  margin-bottom: 16px;
  border-left: 3px solid #22c55e;
  display: none;
}
.success.show { display: block; }
.hint {
  margin-top: 18px;
  text-align: center;
  font-size: 12px;
  color: #94a3b8;
  line-height: 1.6;
}
.hint code {
  background: #f1f5f9;
  padding: 1px 6px;
  border-radius: 4px;
  font-family: "SF Mono", Consolas, monospace;
  font-size: 11px;
  color: #475569;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="logo">知几察微</div>
    <div class="sub">jeeseek.top</div>
    <span class="badge">邀请制内测</span>
  </div>

  <div class="error" id="error"></div>
  <div class="success" id="success"></div>

  <form id="loginForm" autocomplete="on">
    <div class="form-group">
      <label for="username">用户名 / 邮箱</label>
      <input type="text" id="username" name="username" required
             placeholder="花总" autocomplete="username" autofocus>
    </div>
    <div class="form-group">
      <label for="password">密码</label>
      <input type="password" id="password" name="password" required
             placeholder="至少 8 位" autocomplete="current-password" minlength="8">
    </div>
    <button type="submit" class="btn btn-primary" id="submitBtn">登 录</button>
  </form>

  <div class="toggle">
    还没有账号？<a href="/static/register.html">用邀请码注册 →</a>
  </div>

  <div class="hint">
    本站仅限邀请访问 · 没有邀请码请联系管理员
  </div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const errorEl = $('#error');
const successEl = $('#success');

function showError(msg) {
  errorEl.textContent = msg;
  errorEl.classList.add('show');
  successEl.classList.remove('show');
}
function showSuccess(msg) {
  successEl.textContent = msg;
  successEl.classList.add('show');
  errorEl.classList.remove('show');
}
function hideMsg() {
  errorEl.classList.remove('show');
  successEl.classList.remove('show');
}

// 已经在登录态？直接跳走
fetch('/api/auth/me', { credentials: 'include' })
  .then(r => r.json())
  .then(d => {
    if (d.ok && d.authenticated) {
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = next;
    }
  })
  .catch(() => {});

$('#loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  hideMsg();
  const btn = $('#submitBtn');
  btn.disabled = true;
  btn.textContent = '登录中…';
  try {
    const r = await fetch('/api/auth/login', {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: $('#username').value.trim(),
        password: $('#password').value,
      }),
    });
    const d = await r.json();
    if (!r.ok || !d.ok) {
      throw new Error(d.detail || d.error || `HTTP ${r.status}`);
    }
    showSuccess(`欢迎回来，${d.user.display_name || d.user.username}！`);
    setTimeout(() => {
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = next;
    }, 600);
  } catch (err) {
    showError(err.message);
    btn.disabled = false;
    btn.textContent = '登 录';
  }
});
</script>
</body>
</html>
