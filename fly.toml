# fly.toml app configuration file generated for jeeseek-fly on 2026-09-01T13:50:12+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'jeeseek-fly'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  release_command = 'echo Deployment ready'

[env]
  FETCH_INTERVAL = '30'
  LISTEN_HOST = '0.0.0.0'
  PORT = '8001'

[[services]]
  protocol = 'tcp'
  internal_port = 8001
  processes = ['app']

  [[services.ports]]
    port = 80
    handlers = ['http']
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 80

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512